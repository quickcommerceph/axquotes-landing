    <style>
      :root {
        --white: #ffffff;
        --blue: #1788cb;
        --red: #cb174b;
        --gray: #d5d6d9;
      }

      .logo {
        transform-origin: 211px 58.5px;
        animation: logo-settle 1800ms cubic-bezier(.2, .8, .2, 1) both;
      }

      .mark-blue,
      .mark-red,
      .wordmark,
      .highlight {
        stroke-linejoin: round;
        fill-rule: evenodd;
      }

      .mark-blue {
        fill: var(--blue);
        stroke: var(--blue);
        stroke-width: .25;
        animation: accent-in 1600ms cubic-bezier(.22, 1, .36, 1) both, idle-blue 4800ms ease-in-out 1900ms infinite;
      }

      .mark-red {
        fill: var(--red);
        stroke: var(--red);
        stroke-width: .25;
        transform-origin: 41px 73px;
        animation: accent-in 1600ms cubic-bezier(.22, 1, .36, 1) 140ms both, idle-red 4800ms ease-in-out 1900ms infinite;
      }

      .wordmark {
        fill: var(--white);
        stroke: var(--white);
        stroke-width: .25;
        opacity: 0;
        transform: translateX(-10px);
        animation: wordmark-in 1100ms cubic-bezier(.16, 1, .3, 1) 420ms both;
      }

      .highlight {
        fill: var(--gray);
        stroke: var(--gray);
        stroke-width: .25;
        opacity: 0;
        animation: highlight-in 800ms ease-out 850ms both;
      }

      .scan {
        clip-path: url(#logoClip);
        opacity: 0;
        transform: translateX(-180px) skewX(-18deg);
        animation: scan 4800ms cubic-bezier(.45, 0, .2, 1) 1900ms infinite;
      }

      @keyframes logo-settle {
        0% { opacity: 0; transform: scale(.94); }
        55% { opacity: 1; transform: scale(1.018); }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes accent-in {
        0% { opacity: 0; transform: translateY(12px) scale(.92); }
        70% { opacity: 1; transform: translateY(-1px) scale(1.025); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes wordmark-in {
        0% { opacity: 0; transform: translateX(-10px); }
        100% { opacity: 1; transform: translateX(0); }
      }

      @keyframes highlight-in {
        0% { opacity: 0; }
        100% { opacity: .95; }
      }

      @keyframes scan {
        0%, 48% { opacity: 0; transform: translateX(-180px) skewX(-18deg); }
        61% { opacity: .42; }
        78% { opacity: 0; transform: translateX(450px) skewX(-18deg); }
        100% { opacity: 0; transform: translateX(450px) skewX(-18deg); }
      }

      @keyframes idle-blue {
        0%, 48%, 100% { filter: drop-shadow(0 0 0 rgba(23, 136, 203, 0)); }
        62% { filter: drop-shadow(0 0 5px rgba(23, 136, 203, .34)); }
        78% { filter: drop-shadow(0 0 0 rgba(23, 136, 203, 0)); }
      }

      @keyframes idle-red {
        0%, 48%, 100% { filter: drop-shadow(0 0 0 rgba(203, 23, 75, 0)); }
        64% { filter: drop-shadow(0 0 4px rgba(203, 23, 75, .3)); }
        78% { filter: drop-shadow(0 0 0 rgba(203, 23, 75, 0)); }
      }

      @media (prefers-reduced-motion: reduce) {
        .logo,
        .mark-blue,
        .mark-red,
        .wordmark,
        .highlight,
        .scan {
          animation: none;
          opacity: 1;
          transform: none;
          filter: none;
        }
        .scan { display: none; }
      }
    </style>
  </defs>
